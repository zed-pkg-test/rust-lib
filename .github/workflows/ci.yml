name: package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Verify Cargo and Zed ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as handle:
              cargo = tomllib.load(handle)
          with Path(".zpkg.toml").open("rb") as handle:
              zed = tomllib.load(handle)

          cargo_package = cargo["package"]
          zed_package = zed["package"]
          assert cargo_package["name"] == zed_package["name"]
          assert cargo_package["version"] == zed_package["version"] == "1.0.1"
          assert cargo_package["description"] == zed_package["description"]
          assert cargo_package["license"] == zed_package["license"]
          assert cargo_package["repository"] == zed["package"]["repository"]["url"]
          assert cargo_package["readme"] == "README.md"
          assert cargo_package["rust-version"] == "1.88"
          assert zed_package["org"] == "zed-pkg-test"

          # crates.io dependencies and Cargo features stay native to Cargo.
          assert cargo["dependencies"] == {"itoa": "=1.0.18"}
          assert cargo["features"] == {"default": [], "uppercase": []}
          assert "dependencies" not in zed
          assert zed["publish"]["exclude"] == ["Cargo.lock"]
          PY

      - name: Format, lint, and test both feature sets
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          cargo test --all-targets --all-features

      - name: Verify Cargo resolves registry provenance independently
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text())
          packages = {package["name"]: package for package in metadata["packages"]}
          assert packages["rust-lib"]["source"] is None
          assert packages["rust-lib"]["version"] == "1.0.1"
          assert packages["itoa"]["version"] == "1.0.18"
          assert packages["itoa"]["source"].startswith("registry+")
          resolve = metadata["resolve"]
          assert resolve is not None
          root = next(node for node in resolve["nodes"] if node["id"] == resolve["root"])
          assert {dep["name"] for dep in root["deps"]} == {"itoa"}
          PY
          test ! -e .zpkg.lock

      - name: Audit Cargo package contents
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Library source checkout must not track Cargo.lock" >&2
            exit 1
          fi
          cargo package --allow-dirty --list > "$RUNNER_TEMP/package-files.txt"
          cat "$RUNNER_TEMP/package-files.txt"
          grep -Fxq Cargo.toml "$RUNNER_TEMP/package-files.txt"
          grep -Fxq README.md "$RUNNER_TEMP/package-files.txt"
          grep -Fxq scripts/zed-smoke.sh "$RUNNER_TEMP/package-files.txt"
          grep -Fxq src/lib.rs "$RUNNER_TEMP/package-files.txt"
          grep -Fxq Cargo.lock "$RUNNER_TEMP/package-files.txt"
          if grep -Eq '(^|/)(target|\.zed|\.vendor)/' "$RUNNER_TEMP/package-files.txt"; then
            echo "Cargo package contains build or local Zed state" >&2
            exit 1
          fi
          cargo package --allow-dirty
          test ! -e .zpkg.lock
          rm -f Cargo.lock
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload package-content diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-package-files
          path: ${{ runner.temp }}/package-files.txt
          if-no-files-found: warn
          retention-days: 7
